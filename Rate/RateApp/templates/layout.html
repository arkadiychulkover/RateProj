{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate</title>

    <!-- Google Fonts: Rajdhani + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

<header class="header">
    <a href="/lenta/users/lenta/" class="brand-logo">R/ RATE</a>

    <div class="post-rating" id="UsersRating">
        RATING: --
    </div>
    <button class="theme-toggle" onclick="toggleTheme()">
      <i class="ti ti-moon" id="themeIcon"></i>
      <span id="themeLabel">Светлая</span>
    </button>

    <button class="nav-btn" onclick="window.location.href='/cabinet/'">
        <img src="{% static 'assets/icon-profile.png' %}" alt="Profile">
    </button>
</header>

{% block content %}{% endblock %}

<script src="{% static 'js/mainPage.js' %}"></script>
</body>
</html>
