{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

<header class="header">
    <a href="/lenta/users/lenta/" class="brand-logo">RATE</a>

    <div class="post-rating" id="UsersRating">
        RATING: --
    </div>

    <button class="theme-toggle" onclick="toggleTheme()">
      <i class="ti ti-moon" id="themeIcon"></i>
      <span id="themeLabel">Светлая</span>
    </button>

    <button class="nav-btn" onclick="window.location.href='/cabinet/'">
        <img src="{% static 'assets/icon-profile.png' %}" alt="Profile">
    </button>
</header>

{% block content %}{% endblock %}

<script src="{% static 'js/mainPage.js' %}"></script>
</body>
</html>
