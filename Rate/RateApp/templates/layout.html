{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

<header class="header">
    <a href="/lenta/users/lenta/" class="brand-logo">RATE</a>

    <div class="post-rating" id="UsersRating">
        RATING: --
    </div>

    <button class="theme-toggle" onclick="toggleTheme()">
      <i class="ti ti-moon" id="themeIcon"></i>
      <span id="themeLabel">Светлая</span>
    </button>

    <button class="nav-btn" onclick="window.location.href='/cabinet/'" title="Личный кабинет">
        <img src="{% static 'assets/icon-profile.png' %}" alt="Profile">
    </button>
    {% if request.user.is_authenticated %}
    <button class="nav-btn" onclick="globalLogout()" style="margin-left: 8px;" title="Выйти">
        <span style="font-size: 20px;">🚪</span>
    </button>
    {% endif %}
</header>

<script>
async function globalLogout() {
    try {
        await fetch('/api/logout/', { method: 'POST' });
    } catch(e) {}
    localStorage.clear();
    window.location.href = '/login/';
}
</script>

{% block content %}{% endblock %}

<script src="{% static 'js/mainPage.js' %}"></script>
</body>
</html>
