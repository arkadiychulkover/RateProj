{% extends 'layout.html' %}
{% block content %}
<div class="auth-page">
    <div class="auth-left">
        <div class="auth-brand">
            <div class="brand-glyph">R/</div>
            <h1 class="brand-name">RATE</h1>
            <p class="brand-tagline">Создай профиль. Добавляй друзей.<br>Общайся в реальном времени.</p>
            <div class="brand-features">
                <div class="feature-item"><span class="feat-icon">🚀</span> Регистрация за 30 секунд</div>
                <div class="feature-item"><span class="feat-icon">🔒</span> Твои данные защищены</div>
                <div class="feature-item"><span class="feat-icon">🌐</span> Присоединяйся к сообществу</div>
            </div>
        </div>
    </div>
    <div class="auth-right">
        <div class="auth-card">
            <h2 class="auth-title">Регистрация</h2>
            <p class="auth-sub">Создай свой аккаунт</p>

            <div id="error-msg" class="error-msg" style="display:none; color: var(--red); margin-bottom: 15px; font-size: 13px;"></div>
            <div id="success-msg" class="success-msg" style="display:none; color: var(--green); margin-bottom: 15px; font-size: 13px;"></div>

            <div class="form-group">
                <label class="form-label">Логин</label>
                <input type="text" id="username" class="form-input" placeholder="Придумай логин" autocomplete="off">
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-input" placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label class="form-label">Пароль</label>
                <input type="password" id="password" class="form-input" placeholder="Минимум 8 символов">
            </div>
            <div class="form-group">
                <label class="form-label">Повтори пароль</label>
                <input type="password" id="confirm_password" class="form-input" placeholder="Повтори пароль">
            </div>

            <button id="regBtn" class="btn-primary" onclick="doRegister()">
                <span class="btn-text">Создать аккаунт</span>
                <span class="btn-loader" style="display:none">Регистрация...</span>
            </button>

            <div class="auth-divider">или</div>
            <a href="/login/" class="btn-secondary">Уже есть аккаунт? Войти</a>
        </div>
    </div>
</div>

<script>
async function doRegister() {
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm_password').value;
    const btn = document.getElementById('regBtn');

    hideMessages();

    if (!username || !email || !password || !confirm) {
        showError('Заполни все поля');
        return;
    }
    if (password !== confirm) {
        showError('Пароли не совпадают');
        return;
    }
    if (password.length < 8) {
        showError('Пароль должен быть минимум 8 символов');
        return;
    }

    btn.disabled = true;
    btn.querySelector('.btn-text').style.display = 'none';
    btn.querySelector('.btn-loader').style.display = 'inline';

    try {
        const res = await fetch('/api/register/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();

        if (res.ok) {
            localStorage.setItem('userId', data.user_id);
            localStorage.setItem('username', data.username);
            showSuccess('Аккаунт создан! Перенаправляем...');
            setTimeout(() => window.location.href = '/chat/', 800);
        } else {
            showError(data.error || 'Ошибка регистрации');
        }
    } catch(e) {
        showError('Ошибка сети');
    } finally {
        btn.disabled = false;
        btn.querySelector('.btn-text').style.display = 'inline';
        btn.querySelector('.btn-loader').style.display = 'none';
    }
}

function showError(msg) {
    document.getElementById('error-msg').textContent = msg;
    document.getElementById('error-msg').style.display = 'block';
}
function showSuccess(msg) {
    document.getElementById('success-msg').textContent = msg;
    document.getElementById('success-msg').style.display = 'block';
}
function hideMessages() {
    document.getElementById('error-msg').style.display = 'none';
    document.getElementById('success-msg').style.display = 'none';
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
</script>
{% endblock %}
