{% extends 'layout.html' %}
{% block body %}
<div class="auth-page">
    <div class="auth-left">
        <div class="auth-brand">
            <div class="brand-glyph">R/</div>
            <h1 class="brand-name">RATE</h1>
            <p class="brand-tagline">Социальная сеть нового поколения.<br>Оценивай людей. Находи друзей.<br>Будь собой.</p>
            <div class="brand-features">
                <div class="feature-item"><span class="feat-icon">⚡</span> Реальные оценки реальных людей</div>
                <div class="feature-item"><span class="feat-icon">💬</span> Живой чат с друзьями</div>
                <div class="feature-item"><span class="feat-icon">🏆</span> Система рейтинга и тиров</div>
            </div>
        </div>
    </div>
    <div class="auth-right">
        <div class="auth-card">
            <h2 class="auth-title">Войти</h2>
            <p class="auth-sub">Рады видеть тебя снова</p>

            <div id="error-msg" class="error-msg" style="display:none"></div>

            <div class="form-group">
                <label class="form-label">Логин</label>
                <input type="text" id="username" class="form-input" placeholder="Введи логин" autocomplete="off">
            </div>
            <div class="form-group">
                <label class="form-label">Пароль</label>
                <input type="password" id="password" class="form-input" placeholder="Введи пароль">
            </div>

            <button id="loginBtn" class="btn-primary" onclick="doLogin()">
                <span class="btn-text">Войти</span>
                <span class="btn-loader" style="display:none">...</span>
            </button>

            <div class="auth-divider">или</div>
            <a href="/register/" class="btn-secondary">Создать аккаунт</a>
        </div>
    </div>
</div>

<script>
async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errEl = document.getElementById('error-msg');
    const btn = document.getElementById('loginBtn');

    if (!username || !password) {
        showError('Заполни все поля');
        return;
    }

    btn.disabled = true;
    btn.querySelector('.btn-text').style.display = 'none';
    btn.querySelector('.btn-loader').style.display = 'inline';

    try {
        const res = await fetch('/api/login/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
            localStorage.setItem('accessToken', data.access);
            localStorage.setItem('refreshToken', data.refresh);
            localStorage.setItem('userId', data.user_id);
            localStorage.setItem('username', data.username);
            window.location.href = '/chat/';
        } else {
            showError(data.error || 'Ошибка входа');
        }
    } catch(e) {
        showError('Ошибка сети');
    }

    btn.disabled = false;
    btn.querySelector('.btn-text').style.display = 'inline';
    btn.querySelector('.btn-loader').style.display = 'none';
}

function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
{% endblock %}
